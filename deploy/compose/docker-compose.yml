# Local development environment.
# Usage: from this directory, `docker compose up -d` (reads ./.env).

name: itsm

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD must be set in .env}
      # Read by oracle/initdb scripts, on the first database startup only.
      ITSM_OWNER_PASSWORD: ${ITSM_OWNER_PASSWORD:?ITSM_OWNER_PASSWORD must be set in .env}
      ITSM_APP_PASSWORD: ${ITSM_APP_PASSWORD:?ITSM_APP_PASSWORD must be set in .env}
    ports:
      # Loopback only: the database must not be reachable from the network.
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/initdb:/container-entrypoint-initdb.d:ro
    # Oracle Free sizes itself to SGA 1.5 GiB + PGA 0.5 GiB: 2 GiB leaves no headroom.
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Development mode: HTTP, embedded database. No volume on purpose: the realm file is the single
    # source of truth, imported again each time the container is created (ADR-007).
    command: ["start-dev", "--import-realm"]
    environment:
      # Administrator of the master realm (administration console), created on first startup.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      # Replaces ${ITSM_TEST_USER_PASSWORD} in the realm file: no password in Git.
      ITSM_TEST_USER_PASSWORD: ${ITSM_TEST_USER_PASSWORD:?ITSM_TEST_USER_PASSWORD must be set in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      # Loopback only. 8080 is the backend's port on the host.
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    # The JVM heap is sized to 70 % of this limit by the image.
    mem_limit: 768m
    healthcheck:
      # No curl or wget in the image: a minimal HTTP request with Bash's /dev/tcp to the
      # management port (9000, not published).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && while read -r line <&3; do [[ $$line == *'"UP"'* ]] && exit 0; done; exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  oracle-data:
