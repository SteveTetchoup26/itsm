# Continuous integration: runs on every pull request and on every push to main.
# One workflow that always starts; jobs are skipped when their folder is unchanged (ADR-001).
# Only the final "ci" job is required by the branch protection of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more when they need it.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed folders
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/compose/oracle/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      # JSON list of the components whose image must be rebuilt, e.g. ["backend","frontend"].
      - id: images
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          list=()
          [ "$BACKEND" = "true" ] && list+=('"backend"')
          [ "$FRONTEND" = "true" ] && list+=('"frontend"')
          echo "list=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (format, build, unit and integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Empty for pull requests from forks and from Dependabot: the analysis step is then skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube Cloud detects new code with Git blame
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # verify = Spotless check, compile, unit tests (surefire), integration tests with
      # Testcontainers (failsafe, Docker is available on GitHub-hosted runners), JaCoCo report.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: SonarQube Cloud analysis (code and JaCoCo coverage)
        if: env.SONAR_TOKEN != ''
        run: ./mvnw --batch-mode --no-transfer-progress sonar:sonar

  frontend:
    name: Frontend (format, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No dependency lifecycle scripts (supply-chain risk); the build does not need them.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: SonarQube Cloud analysis (code and Vitest coverage)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          projectBaseDir: frontend

  # Secrets in the code and in the whole Git history (the local pre-commit hook can be bypassed).
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary; no write access to pull requests needed.
          GITLEAKS_ENABLE_COMMENTS: false

  # Security analysis of the source code; alerts are listed in the Security tab.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: analysed from the sources, without compiling (Java only, no Kotlin here).
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Docker images: built and scanned on every pull request, published to GHCR from main only.
  images:
    name: Image ${{ matrix.component }} (build, Trivy, publish from main)
    needs: [changes, backend, frontend]
    # Only when its component changed and its tests did not fail.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE: ghcr.io/stevetetchoup26/itsm-${{ matrix.component }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Same Trivy as on the developer machine, pinned by digest.
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 emulation: only the runtime stage runs emulated, the build stage uses $BUILDPLATFORM.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tag sha-<short commit> and OCI labels (the source label links the package to this repository).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build for scanning (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy report (critical and high, not blocking)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY" image --no-progress --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 0 "$IMAGE:scan"
      - name: Trivy gate (fixable critical vulnerabilities block the pipeline)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY" image --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed
          --exit-code 1 "$IMAGE:scan"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 and arm64 (pushed from main only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Single required check: fails if any job failed or was cancelled; skipped jobs count as success.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, secrets, codeql, images]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "At least one job failed or was cancelled."
            exit 1
          fi
