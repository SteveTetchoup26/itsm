# Continuous integration: runs on every pull request and on every push to main.
# One workflow that always starts; jobs are skipped when their folder is unchanged (ADR-001).
# Only the final "ci" job is required by the branch protection of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more when they need it.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed folders
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/compose/oracle/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (format, build, unit and integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Empty for pull requests from forks and from Dependabot: the analysis step is then skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube Cloud detects new code with Git blame
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # verify = Spotless check, compile, unit tests (surefire), integration tests with
      # Testcontainers (failsafe, Docker is available on GitHub-hosted runners), JaCoCo report.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: SonarQube Cloud analysis (code and JaCoCo coverage)
        if: env.SONAR_TOKEN != ''
        run: ./mvnw --batch-mode --no-transfer-progress sonar:sonar

  frontend:
    name: Frontend (format, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No dependency lifecycle scripts (supply-chain risk); the build does not need them.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: SonarQube Cloud analysis (code and Vitest coverage)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: frontend

  # Secrets in the code and in the whole Git history (the local pre-commit hook can be bypassed).
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary; no write access to pull requests needed.
          GITLEAKS_ENABLE_COMMENTS: false

  # Security analysis of the source code; alerts are listed in the Security tab.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: analysed from the sources, without compiling (Java only, no Kotlin here).
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  # Single required check: fails if any job failed or was cancelled; skipped jobs count as success.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, secrets, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "At least one job failed or was cancelled."
            exit 1
          fi
