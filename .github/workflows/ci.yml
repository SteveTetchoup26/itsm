# Continuous integration: runs on every pull request and on every push to main.
# One workflow that always starts; jobs are skipped when their folder is unchanged (ADR-001).
# Only the final "ci" job is required by the branch protection of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more when they need it.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed folders
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/compose/oracle/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      # JSON list of the components whose image must be rebuilt, e.g. ["backend","frontend"].
      # On main, both images are rebuilt as soon as one changes: one merge = one version
      # (sha-<commit>) for the whole application, deployed and rolled back as a unit.
      - id: images
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$ON_MAIN" = "true" ] && { [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ]; }; then
            BACKEND=true FRONTEND=true
          fi
          list=()
          [ "$BACKEND" = "true" ] && list+=('"backend"')
          [ "$FRONTEND" = "true" ] && list+=('"frontend"')
          echo "list=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (format, build, unit and integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Empty for pull requests from forks and from Dependabot: the analysis step is then skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube Cloud detects new code with Git blame
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # verify = Spotless check, compile, unit tests (surefire), integration tests with
      # Testcontainers (failsafe, Docker is available on GitHub-hosted runners), JaCoCo report.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: SonarQube Cloud analysis (code and JaCoCo coverage)
        if: env.SONAR_TOKEN != ''
        run: ./mvnw --batch-mode --no-transfer-progress sonar:sonar

  frontend:
    name: Frontend (format, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No dependency lifecycle scripts (supply-chain risk); the build does not need them.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: SonarQube Cloud analysis (code and Vitest coverage)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          projectBaseDir: frontend

  # Secrets in the code and in the whole Git history (the local pre-commit hook can be bypassed).
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # lists the commits of the pull request to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary; no write access to pull requests needed.
          GITLEAKS_ENABLE_COMMENTS: false

  # Security analysis of the source code; alerts are listed in the Security tab.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # reads the workflow run it belongs to
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: analysed from the sources, without compiling (Java only, no Kotlin here).
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Docker images: built and scanned on every pull request, published to GHCR from main only.
  images:
    name: Image ${{ matrix.component }} (build, Trivy, publish from main)
    needs: [changes, backend, frontend]
    # Only when its component changed and its tests did not fail.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE: ghcr.io/stevetetchoup26/itsm-${{ matrix.component }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Same Trivy as on the developer machine, pinned by digest.
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 emulation: only the runtime stage runs emulated, the build stage uses $BUILDPLATFORM.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tag sha-<short commit> and OCI labels (the source label links the package to this repository).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build for scanning (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy report (critical and high, not blocking)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY" image --no-progress --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 0 "$IMAGE:scan"
      - name: Trivy gate (fixable critical vulnerabilities block the pipeline)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY" image --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed
          --exit-code 1 "$IMAGE:scan"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 and arm64 (pushed from main only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Continuous deployment (ADR-012): main only, after both images are published.
  # The VM is reached over Tailscale; nothing is exposed on the Internet but Caddy (80, 443).
  # Disabled until the variable ITSM_DEPLOY_ENABLED is set to true in the environment.
  deploy:
    name: Deploy to production
    needs: [changes, images]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.images.result == 'success' && vars.ITSM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main can use this environment; the Tailscale identity accepts only this environment.
    environment: production
    # One deployment at a time, never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for a Tailscale node (no stored secret)
    env:
      VM: deploy@${{ vars.VM_TAILNET_HOST }}
      DOMAIN: ${{ vars.ITSM_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/compose
      - name: Join the tailnet (ephemeral node, tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: SSH key and VM host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf 'StrictHostKeyChecking yes\nBatchMode yes\n' > ~/.ssh/config
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          # The VM's identity is pinned: no connection to a host presenting another key.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack and write its settings
        env:
          ITSM_DB_URL: ${{ secrets.ITSM_DB_URL }}
          ITSM_OWNER_PASSWORD: ${{ secrets.ITSM_OWNER_PASSWORD }}
          ITSM_APP_PASSWORD: ${{ secrets.ITSM_APP_PASSWORD }}
        run: |
          scp deploy/compose/compose.prod.yml deploy/compose/Caddyfile \
            deploy/compose/deploy.sh "$VM:/opt/itsm/"
          # Settings and secrets go through SSH's standard input: never on a command line.
          printf 'ITSM_DOMAIN=%s\nITSM_DB_URL=%s\nITSM_OWNER_PASSWORD=%s\nITSM_APP_PASSWORD=%s\n' \
            "$DOMAIN" "$ITSM_DB_URL" "$ITSM_OWNER_PASSWORD" "$ITSM_APP_PASSWORD" \
            | ssh "$VM" 'umask 077 && cat > /opt/itsm/.env.prod'
      - name: Deploy (rolls back by itself if the new version is not healthy)
        # Same tag as the images job (docker/metadata-action, type=sha, short format: 7 characters).
        run: |
          # shellcheck disable=SC2029 # expanded here on purpose: the runner computes the tag
          ssh "$VM" "/opt/itsm/deploy.sh sha-${GITHUB_SHA::7}"
      - name: Smoke tests from the Internet
        id: smoke
        run: |
          for _ in $(seq 1 12); do
            if body=$(curl -fsS --max-time 10 "https://$DOMAIN/api/v1/system/info") \
               && grep -q '"database":"UP"' <<<"$body" \
               && curl -fsS --max-time 10 -o /dev/null "https://$DOMAIN/"; then
              echo "OK: $body"; exit 0
            fi
            sleep 5
          done
          echo "Smoke tests failed"; exit 1
      - name: Roll back after failed smoke tests
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh "$VM" "/opt/itsm/deploy.sh --rollback"

  # Single required check: fails if any job failed or was cancelled; skipped jobs count as success.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, secrets, codeql, images, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "At least one job failed or was cancelled."
            exit 1
          fi
