# Mises a jour automatiques des dependances (Pull Requests hebdomadaires).
# Les blocs commentes seront actives en I0, quand backend/ et frontend/ existeront.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

