# Mises a jour automatiques des dependances (Pull Requests hebdomadaires, testees par la CI).
# ADR-003 : les versions majeures et mineures de la pile (Spring Boot, Angular) sont des
# decisions planifiees ; Dependabot ne propose pour elles que les correctifs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One weekly PR for all actions (codeql-action init and analyze must stay in step).
      github-actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns: ["org.springframework*"]
    ignore:
      # Spring Boot fixes the versions of its ecosystem (ADR-003, principle 4): only its patches.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Maven itself (wrapper): 3.9.x is fixed by ADR-003.
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      # @vitest/coverage-v8 requires the exact same version as vitest.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # Angular majors and minors go through "ng update" (migrations), not Dependabot.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The supported TypeScript range is set by the Angular version.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images referenced by the local Docker Compose file (Oracle Free).
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base images of the backend and frontend Dockerfiles.
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Java 25 and Node 24 are the LTS chosen by ADR-003: no major upgrade by Dependabot.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Nginx: even minors are stable branches (1.30), odd ones mainline (1.31): stay on 1.30.x.
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
