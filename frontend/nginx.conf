# Complete Nginx configuration, written for a process that is not root (uid 101, see Dockerfile):
# no "user" directive, and the only writable place, /tmp, holds the pid and the temporary files.
# TLS, compression and /api routing are done by Caddy in front (I0-10).
worker_processes auto;
pid /tmp/nginx.pid;
# The official image links these log files to the container's stderr and stdout.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Do not advertise the Nginx version in headers and error pages.
    server_tokens off;

    # Serves the Angular build.
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Single-page application: an unknown path (/tickets/42) returns index.html,
        # and the Angular router displays the right page.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html must always be revalidated: it points to the files of the current version.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Built files carry a content hash in their name (main-PK2XHPVT.js): cacheable for a year.
        location ~* \.(?:js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
