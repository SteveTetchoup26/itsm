# Serves the Angular build. TLS, compression and /api routing are done by Caddy in front (I0-10).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the Nginx version in headers and error pages.
    server_tokens off;

    # Single-page application: an unknown path (/tickets/42) returns index.html,
    # and the Angular router displays the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated: it points to the files of the current version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files carry a content hash in their name (main-PK2XHPVT.js): cacheable for a year.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
