# SonarQube Cloud analysis of the frontend (run by the CI pipeline, not by automatic analysis).
sonar.organization=stevetetchoup26
sonar.projectKey=SteveTetchoup26_itsm-frontend
sonar.projectName=itsm-frontend

sonar.sources=src
sonar.exclusions=src/**/*.spec.ts
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

# Produced by "npm run test:ci" (Vitest coverage in lcov format).
sonar.javascript.lcov.reportPaths=coverage/itsm-frontend/lcov.info
sonar.sourceEncoding=UTF-8
